name: pixelcanvas
description: "PixelCanvas — The simplest way to create pixel art, anywhere, anytime, even offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management & DI (Blueprint §10) ──
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation & Routing (Blueprint §7) ──
  go_router: ^14.2.0

  # ── Local Key-Value Storage (Blueprint §17.4) ──
  shared_preferences: ^2.3.0

  # ── Network & Connectivity (Blueprint §11.5) ──
  connectivity_plus: ^6.0.4
  internet_connection_checker_plus: ^2.5.2
  dio: ^5.5.0+1

  # ── Core Utilities & Data Formats (Blueprint Appendix A) ──
  uuid: ^4.4.2
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # ── Image Processing & Media Sharing (Blueprint §28.12) ──
  image: ^4.2.0
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  share_plus: ^9.0.0

  # ── UI Micro-Animations (Blueprint §26.5) ──
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # ── Structured Logging (Blueprint §35.1) ──
  logger: ^2.4.0

  # ── Serialization & Immutable Modeling ──
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Linting & Code Style (Blueprint §24.9) ──
  flutter_lints: ^5.0.0
  very_good_analysis: ^7.0.0

  # ── Code Generation Tools ──
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # ── Unit & Integration Testing (Blueprint §20) ──
  mocktail: ^1.0.4

dependency_overrides:
  analyzer: 5.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/empty_states/
    - assets/images/auth/
    - assets/images/misc/
    - assets/illustrations/
    - assets/templates/
    - assets/palettes/
    - assets/lottie/
    - assets/icons/
